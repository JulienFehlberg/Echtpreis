name: Price Engine Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sparkorb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run test suite
        run: npm test
      - name: Run PostgreSQL price engine integration test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sparkorb_test
        run: node tests/current-price-postgres.test.js
      - name: Run PostgreSQL inventory integration test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sparkorb_test
        run: node tests/price-inventory-postgres.test.js
      - name: Run PostgreSQL product catalog integration test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sparkorb_test
        run: node tests/product-catalog-postgres.test.js
      - name: Run PostgreSQL price coverage integration test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sparkorb_test
        run: node tests/price-coverage-postgres.test.js
      - name: Run PostgreSQL autonomous retailer price integration test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sparkorb_test
        run: node tests/published-price-postgres.test.js
      - name: Run PostgreSQL Berliner Wolt retailer price integration test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sparkorb_test
        run: node tests/wolt-retailer-price-postgres.test.js
      - name: Run PostgreSQL Berliner REWE pickup price integration test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sparkorb_test
        run: node tests/rewe-retailer-price-postgres.test.js
      - name: Run PostgreSQL ALDI published assortment price integration test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sparkorb_test
        run: node tests/aldi-assortment-price-postgres.test.js
      - name: Run PostgreSQL multi-market Wolt price integration test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sparkorb_test
        run: node tests/wolt-multi-market-postgres.test.js

      - name: Run PostgreSQL Berliner HIT store price integration test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sparkorb_test
        run: node tests/hit-price-postgres.test.js

      - name: Run PostgreSQL Berliner retailer reference integration test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sparkorb_test
        run: node tests/berlin-reference-postgres.test.js

      - name: Run PostgreSQL Berliner PENNY publication integration test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sparkorb_test
        run: node tests/penny-berlin-publications-postgres.test.js
