name: ECHTPREIS release checks

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check API syntax
        run: node --check server.js
      - name: Static app guards
        run: npm run test:static
      - name: API unit smoke
        run: npm run test:server
      - name: Receipt vision unit tests
        run: npm run test:vision
      - name: Browser smoke
        shell: bash
        run: |
          set -o pipefail
          npm run test:browser 2>&1 | tee browser-smoke.log
      - name: Upload browser smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-diagnostics
          path: browser-smoke.log
